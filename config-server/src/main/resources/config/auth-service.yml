spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/inventory_db
server:
  port: 8081

jwt:
  secret: MyVeryStrongJwtSecretKeyForInterviewProject123456

eureka:
  client:
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/
logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

  zipkin:
    tracing:
      endpoint: http://host.docker.internal:9411/api/v2/spans
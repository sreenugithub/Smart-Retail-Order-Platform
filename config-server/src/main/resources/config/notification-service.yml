server:
  port: 8085

spring:
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/inventory_db
  kafka:
    bootstrap-servers: kafka-srini-csreenu-3ace.k.aivencloud.com:10391
    properties:
      security.protocol: SASL_SSL
      ssl.truststore.location: classpath:certs/kafka.truststore.jks
      ssl.truststore.password: changeit
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="avnadmin"
        password="AVNS_AGdTVt5fOxbKytDli6F";

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.retail.notification_service.event
        spring.json.value.default.type: com.retail.notification_service.event.OrderCreatedEvent
        spring.json.use.type.headers: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

app:
  kafka:
    topics:
      order-created: order-created-topic

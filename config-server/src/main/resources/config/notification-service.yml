server:
  port: 8085

spring:
  kafka:
    bootstrap-servers: kafka-srini-csreenu-3ace.k.aivencloud.com:10391
    properties:
      security.protocol: SASL_SSL
      ssl.truststore.location: classpath:certs/kafka.truststore.jks
      ssl.truststore.password: changeit
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >
      org.apache.kafka.common.security.scram.ScramLoginModule required
      username="${AIVEN_KAFKA_USERNAME:avnadmin}"
      password="${AIVEN_KAFKA_PASSWORD}";

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.retail.notification_service.event
        spring.json.value.default.type: com.retail.notification_service.event.OrderCreatedEvent
        spring.json.use.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [corrId=%X{correlationId}] %msg%n"

app:
  kafka:
    topics:
      order-created: order-created-topic

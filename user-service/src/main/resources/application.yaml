spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/user_db
  config:
    import: "configserver:http://localhost:8888"

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

info:
  app:
    name: Auth Service
    version: 1.0.0
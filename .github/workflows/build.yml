name: Build Smart Retail Microservices

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-dockerize:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - auth-service
          - user-service
          - inventory-service
          - order-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission
        run: chmod +x gradlew
        working-directory: ${{ matrix.service }}

      - name: Build JAR
        run: ./gradlew clean build -x test
        working-directory: ${{ matrix.service }}

      - name: Build Docker Image
        run: |
          docker build -t smart-retail/${{ matrix.service }}:latest .
        working-directory: ${{ matrix.service }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag smart-retail/${{ matrix.service }}:latest \
          ${{ secrets.DOCKER_USERNAME }}/smart-retail-${{ matrix.service }}:latest

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/smart-retail-${{ matrix.service }}:latest
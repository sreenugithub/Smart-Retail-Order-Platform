apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
       containers:
        - name: api-gateway
          image: smart-retail/api-gateway:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8084

          env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/